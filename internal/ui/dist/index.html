<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goban</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .sortable-ghost { opacity: 0.3; }
    .sortable-drag  { opacity: 0.9; cursor: grabbing; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen" x-data="app()" x-init="init()" x-cloak>

  <!-- Board List -->
  <div x-show="view === 'boards'">
    <header class="border-b border-gray-800 px-6 py-4 flex items-center justify-between">
      <h1 class="text-xl font-semibold tracking-tight">Goban</h1>
      <button @click="openCreateBoard()"
        class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 rounded text-sm font-medium transition-colors">
        New Board
      </button>
    </header>

    <main class="p-6">
      <div x-show="boards.length === 0" class="text-gray-500 text-sm">No boards yet.</div>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <template x-for="board in boards" :key="board.id">
          <div @click="openBoard(board)"
            class="bg-gray-900 border border-gray-800 rounded-lg p-4 cursor-pointer hover:border-gray-600 transition-colors">
            <h2 class="font-medium mb-1" x-text="board.name"></h2>
            <p class="text-sm text-gray-400 line-clamp-2" x-text="board.description || 'No description'"></p>
          </div>
        </template>
      </div>
    </main>
  </div>

  <!-- Board View -->
  <div x-show="view === 'board'" class="flex flex-col h-screen">
    <header class="border-b border-gray-800 px-6 py-4 flex items-center gap-4 shrink-0">
      <button @click="view = 'boards'" class="text-gray-400 hover:text-gray-100 text-sm transition-colors">
        ← Boards
      </button>
      <h1 class="text-xl font-semibold tracking-tight" x-text="currentBoard?.name"></h1>
      <div class="ml-auto">
        <button @click="openCreateTask()"
          class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 rounded text-sm font-medium transition-colors">
          New Task
        </button>
      </div>
    </header>

    <div class="flex gap-4 p-4 overflow-x-auto flex-1 items-start">
      <template x-for="col in columns" :key="col.id">
        <div class="bg-gray-900 rounded-lg p-3 w-72 shrink-0">
          <div class="flex items-center justify-between mb-3">
            <span class="text-sm font-medium text-gray-300" x-text="col.name"></span>
            <span class="text-xs text-gray-500"
              x-text="tasksForColumn(col.id).length + (col.wip_limit > 0 ? ' / ' + col.wip_limit : '')">
            </span>
          </div>
          <div class="flex flex-col gap-2 min-h-8"
            :id="'col-' + col.id"
            x-init="initSortable($el, col.id)">
            <template x-for="task in tasksForColumn(col.id)" :key="task.id">
              <div @click="openTask(task)"
                :data-id="task.id"
                class="bg-gray-800 border border-gray-700 rounded p-3 cursor-grab hover:border-gray-500 transition-colors">
                <div class="flex items-start justify-between gap-2 mb-1">
                  <span class="text-sm font-medium leading-snug" x-text="task.title"></span>
                  <span class="shrink-0 text-xs px-1.5 py-0.5 rounded font-medium"
                    :class="priorityClass(task.priority)"
                    x-text="task.priority">
                  </span>
                </div>
                <div x-show="task.labels" class="flex flex-wrap gap-1 mt-2">
                  <template x-for="label in task.labels.split(',')" :key="label">
                    <span class="text-xs bg-gray-700 text-gray-300 px-1.5 py-0.5 rounded"
                      x-text="label.trim()">
                    </span>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- Create Board Modal -->
  <div x-show="modal === 'createBoard'"
    class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4"
    @keydown.escape.window="modal = null">
    <div class="bg-gray-900 border border-gray-700 rounded-lg p-6 w-full max-w-md" @click.stop>
      <h2 class="text-lg font-semibold mb-4">New Board</h2>
      <form @submit.prevent="createBoard()">
        <div class="mb-4">
          <label class="block text-sm text-gray-400 mb-1">Name</label>
          <input x-model="form.name" type="text" required autofocus
            class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500" />
        </div>
        <div class="mb-6">
          <label class="block text-sm text-gray-400 mb-1">Description</label>
          <textarea x-model="form.description" rows="2"
            class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500"></textarea>
        </div>
        <div class="flex justify-end gap-2">
          <button type="button" @click="modal = null"
            class="px-3 py-1.5 text-sm text-gray-400 hover:text-gray-100 transition-colors">Cancel</button>
          <button type="submit"
            class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 rounded text-sm font-medium transition-colors">
            Create
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Create Task Modal -->
  <div x-show="modal === 'createTask'"
    class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4"
    @keydown.escape.window="modal = null">
    <div class="bg-gray-900 border border-gray-700 rounded-lg p-6 w-full max-w-md" @click.stop>
      <h2 class="text-lg font-semibold mb-4">New Task</h2>
      <form @submit.prevent="createTask()">
        <div class="mb-4">
          <label class="block text-sm text-gray-400 mb-1">Title</label>
          <input x-model="form.title" type="text" required autofocus
            class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500" />
        </div>
        <div class="mb-4">
          <label class="block text-sm text-gray-400 mb-1">Description</label>
          <textarea x-model="form.description" rows="3"
            class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500"></textarea>
        </div>
        <div class="mb-4 flex gap-3">
          <div class="flex-1">
            <label class="block text-sm text-gray-400 mb-1">Priority</label>
            <select x-model="form.priority"
              class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
              <option value="critical">Critical</option>
            </select>
          </div>
          <div class="flex-1">
            <label class="block text-sm text-gray-400 mb-1">Labels</label>
            <input x-model="form.labels" type="text" placeholder="comma, separated"
              class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500" />
          </div>
        </div>
        <div class="flex justify-end gap-2">
          <button type="button" @click="modal = null"
            class="px-3 py-1.5 text-sm text-gray-400 hover:text-gray-100 transition-colors">Cancel</button>
          <button type="submit"
            class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 rounded text-sm font-medium transition-colors">
            Create
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Task Detail Modal -->
  <div x-show="modal === 'task'"
    class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4"
    @keydown.escape.window="modal = null">
    <div class="bg-gray-900 border border-gray-700 rounded-lg w-full max-w-2xl max-h-[90vh] flex flex-col" @click.stop>
      <div class="flex items-start justify-between p-6 border-b border-gray-800">
        <div class="flex-1 mr-4">
          <h2 class="text-lg font-semibold" x-text="selectedTask?.title"></h2>
          <div class="flex items-center gap-2 mt-1">
            <span class="text-xs px-1.5 py-0.5 rounded font-medium"
              :class="priorityClass(selectedTask?.priority)"
              x-text="selectedTask?.priority">
            </span>
            <template x-if="selectedTask?.labels">
              <template x-for="label in (selectedTask?.labels || '').split(',')" :key="label">
                <span class="text-xs bg-gray-700 text-gray-300 px-1.5 py-0.5 rounded" x-text="label.trim()"></span>
              </template>
            </template>
          </div>
        </div>
        <button @click="modal = null" class="text-gray-500 hover:text-gray-300 text-xl leading-none">&times;</button>
      </div>

      <div class="flex-1 overflow-y-auto p-6">
        <div x-show="selectedTask?.description" class="mb-6">
          <h3 class="text-xs uppercase tracking-wider text-gray-500 mb-2">Description</h3>
          <p class="text-sm text-gray-300 whitespace-pre-wrap" x-text="selectedTask?.description"></p>
        </div>

        <div>
          <h3 class="text-xs uppercase tracking-wider text-gray-500 mb-3">Comments</h3>
          <div class="flex flex-col gap-3 mb-4">
            <template x-for="comment in selectedTaskComments" :key="comment.id">
              <div class="bg-gray-800 rounded p-3">
                <div class="flex items-center gap-2 mb-1">
                  <span class="text-xs font-medium text-blue-400" x-text="comment.author"></span>
                  <span class="text-xs text-gray-500" x-text="formatDate(comment.created_at)"></span>
                </div>
                <p class="text-sm text-gray-300 whitespace-pre-wrap" x-text="comment.body"></p>
              </div>
            </template>
            <div x-show="selectedTaskComments.length === 0" class="text-sm text-gray-500">No comments yet.</div>
          </div>

          <form @submit.prevent="addComment()">
            <textarea x-model="form.commentBody" rows="2" placeholder="Add a comment..."
              class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500 mb-2"></textarea>
            <button type="submit"
              class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 rounded text-sm font-medium transition-colors">
              Comment
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

<script>
function app() {
  return {
    view: 'boards',
    modal: null,
    boards: [],
    currentBoard: null,
    columns: [],
    tasks: [],
    selectedTask: null,
    selectedTaskComments: [],
    form: {},
    _sortables: [],

    async init() {
      await this.loadBoards()
    },

    initSortable(el, columnId) {
      const self = this
      const s = Sortable.create(el, {
        group: 'tasks',
        animation: 150,
        ghostClass: 'sortable-ghost',
        dragClass: 'sortable-drag',
        // Don't fire click after a drag
        onChoose() { el._dragging = false },
        onStart()  { el._dragging = true },
        async onEnd(evt) {
          const taskId   = evt.item.dataset.id
          const toColId  = evt.to.id.replace('col-', '')
          const position = evt.newIndex

          // Optimistically update local state so UI doesn't snap back
          const task = self.tasks.find(t => t.id === taskId)
          if (task) task.column_id = toColId

          await fetch(`/api/v1/tasks/${taskId}/move`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ column_id: toColId, position }),
          })
        },
      })
      this._sortables.push(s)
    },

    async loadBoards() {
      const res = await fetch('/api/v1/boards')
      this.boards = await res.json() || []
    },

    async openBoard(board) {
      this._sortables.forEach(s => s.destroy())
      this._sortables = []
      this.currentBoard = board
      const res = await fetch(`/api/v1/boards/${board.id}`)
      const data = await res.json()
      this.columns = data.columns || []
      const tasksRes = await fetch(`/api/v1/boards/${board.id}/tasks`)
      this.tasks = await tasksRes.json() || []
      this.view = 'board'
    },

    tasksForColumn(columnId) {
      return this.tasks.filter(t => t.column_id === columnId)
    },

    openCreateBoard() {
      this.form = { name: '', description: '' }
      this.modal = 'createBoard'
    },

    async createBoard() {
      await fetch('/api/v1/boards', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: this.form.name, description: this.form.description }),
      })
      this.modal = null
      await this.loadBoards()
    },

    openCreateTask() {
      this.form = { title: '', description: '', priority: 'medium', labels: '' }
      this.modal = 'createTask'
    },

    async createTask() {
      await fetch(`/api/v1/boards/${this.currentBoard.id}/tasks`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: this.form.title,
          description: this.form.description,
          priority: this.form.priority,
          labels: this.form.labels,
        }),
      })
      this.modal = null
      await this.openBoard(this.currentBoard)
    },

    async openTask(task) {
      // Don't open modal if this click was the end of a drag
      if (task._dragging) return
      this.selectedTask = task
      this.selectedTaskComments = []
      this.form = { commentBody: '' }
      const res = await fetch(`/api/v1/tasks/${task.id}`)
      const data = await res.json()
      this.selectedTask = data.task
      this.selectedTaskComments = data.comments || []
      this.modal = 'task'
    },

    async addComment() {
      if (!this.form.commentBody.trim()) return
      await fetch(`/api/v1/tasks/${this.selectedTask.id}/comments`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ body: this.form.commentBody, author: 'luke' }),
      })
      this.form.commentBody = ''
      const res = await fetch(`/api/v1/tasks/${this.selectedTask.id}`)
      const data = await res.json()
      this.selectedTaskComments = data.comments || []
    },

    priorityClass(priority) {
      return {
        low:      'bg-gray-700 text-gray-300',
        medium:   'bg-blue-900 text-blue-300',
        high:     'bg-amber-900 text-amber-300',
        critical: 'bg-red-900 text-red-300',
      }[priority] || 'bg-gray-700 text-gray-300'
    },

    formatDate(iso) {
      return new Date(iso).toLocaleString(undefined, { dateStyle: 'short', timeStyle: 'short' })
    },
  }
}
</script>
</body>
</html>
